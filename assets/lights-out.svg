<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="900" height="170" role="img" aria-label="Five red start lights come on and go out, then the text Lights out appears">
<style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.l0{animation:l0 9s linear infinite}@keyframes l0{0%,5.6%{opacity:0}6.1%,50%{opacity:1}50.3%,100%{opacity:0}}.l1{animation:l1 9s linear infinite}@keyframes l1{0%,13.3%{opacity:0}13.8%,50%{opacity:1}50.3%,100%{opacity:0}}.l2{animation:l2 9s linear infinite}@keyframes l2{0%,21.1%{opacity:0}21.6%,50%{opacity:1}50.3%,100%{opacity:0}}.l3{animation:l3 9s linear infinite}@keyframes l3{0%,28.9%{opacity:0}29.4%,50%{opacity:1}50.3%,100%{opacity:0}}.l4{animation:l4 9s linear infinite}@keyframes l4{0%,36.7%{opacity:0}37.2%,50%{opacity:1}50.3%,100%{opacity:0}}
.go{font-size:34px;font-weight:700;fill:#f1efe9;letter-spacing:.2em;animation:go 9s linear infinite}
@keyframes go{0%,50%{opacity:0}51%,92%{opacity:1}96%,100%{opacity:0}}
.streak{animation:streak 9s cubic-bezier(.3,0,.8,1) infinite}
@keyframes streak{0%,50%{transform:translateX(-300px)}62%,100%{transform:translateX(1000px)}}
@media (prefers-reduced-motion:reduce){.l0,.l1,.l2,.l3,.l4,.go,.streak{animation:none}.l0,.l1,.l2,.l3,.l4{opacity:0}}
</style><rect width="900" height="170" rx="10" fill="#0d0e12"/><rect x=".5" y=".5" width="899" height="169" rx="10" fill="none" stroke="#2a2c34"/><rect x="224" y="16" width="52" height="92" rx="6" fill="#16171d" stroke="#2a2c34"/><circle cx="250" cy="40" r="15" fill="#2b0c0c"/><circle class="l0" cx="250" cy="40" r="15" fill="#ff1a12"/><circle cx="250" cy="84" r="15" fill="#2b0c0c"/><circle class="l0" cx="250" cy="84" r="15" fill="#ff1a12"/><rect x="314" y="16" width="52" height="92" rx="6" fill="#16171d" stroke="#2a2c34"/><circle cx="340" cy="40" r="15" fill="#2b0c0c"/><circle class="l1" cx="340" cy="40" r="15" fill="#ff1a12"/><circle cx="340" cy="84" r="15" fill="#2b0c0c"/><circle class="l1" cx="340" cy="84" r="15" fill="#ff1a12"/><rect x="404" y="16" width="52" height="92" rx="6" fill="#16171d" stroke="#2a2c34"/><circle cx="430" cy="40" r="15" fill="#2b0c0c"/><circle class="l2" cx="430" cy="40" r="15" fill="#ff1a12"/><circle cx="430" cy="84" r="15" fill="#2b0c0c"/><circle class="l2" cx="430" cy="84" r="15" fill="#ff1a12"/><rect x="494" y="16" width="52" height="92" rx="6" fill="#16171d" stroke="#2a2c34"/><circle cx="520" cy="40" r="15" fill="#2b0c0c"/><circle class="l3" cx="520" cy="40" r="15" fill="#ff1a12"/><circle cx="520" cy="84" r="15" fill="#2b0c0c"/><circle class="l3" cx="520" cy="84" r="15" fill="#ff1a12"/><rect x="584" y="16" width="52" height="92" rx="6" fill="#16171d" stroke="#2a2c34"/><circle cx="610" cy="40" r="15" fill="#2b0c0c"/><circle class="l4" cx="610" cy="40" r="15" fill="#ff1a12"/><circle cx="610" cy="84" r="15" fill="#2b0c0c"/><circle class="l4" cx="610" cy="84" r="15" fill="#ff1a12"/>
<text class="m go" x="450" y="150" text-anchor="middle">LIGHTS OUT</text>
<rect class="streak" x="0" y="126" width="240" height="3" fill="#e10600"/>
</svg>